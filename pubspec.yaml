name: snappark
description: SnapPark V2 - 주차 위치 기록 앱
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Local storage (Flutter ↔ Android Native 공유)
  shared_preferences: ^2.3.2

  # Data model serialization
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4

  # Camera & OCR
  # ── OCR 정책 (v4 — 실시간 image stream + AR 박스 + 자동 캡처) ──────────────
  #   v1(좌표 매핑) → v2(isolate 크롭) 모두 실기기에서 실패해 폐기. 현재 파이프라인:
  #     1) CameraController.startImageStream → CameraImage 매 프레임
  #     2) CameraImage → InputImage.fromBytes 변환 (Android nv21 / iOS bgra8888)
  #     3) ML Kit Korean 인식 (스로틀링 _isProcessing 으로 1회 분석 보장)
  #     4) boundingBox → 화면 좌표(비율 + 스케일) 변환 → CustomPainter 로 AR 박스
  #     5) 가이드 영역 교차 + 패턴(영문/숫자, 길이 1~5) 매칭 → 자동 캡처
  #     6) stopImageStream → takePicture → 시트
  #   `image` 패키지 의존성 없음 — image stream + ML Kit 만으로 처리.
  camera: ^0.11.0
  google_mlkit_text_recognition: ^0.14.0
  path_provider: ^2.1.4

  # 로컬 푸시 알림 (Bluetooth 감지 후 알림 표시)
  flutter_local_notifications: ^18.0.0

  # 기압 센서 (주차 층수 추측용)
  sensors_plus: ^6.1.1

  # 앱 시스템 설정 페이지 열기 (카메라 권한 거부 → 설정 이동, 알림 설정 이동)
  app_settings: ^5.0.0

  # 런타임 권한 일괄 요청 (최초 실행 온보딩 페이지에서 카메라/위치/알림 한 번에)
  permission_handler: ^11.3.1

  # GPS 현재 위치 (촬영 시점 주차 좌표 저장)
  geolocator: ^13.0.1

  # 좌표 → 한국어 주소 역지오코딩 (Android Geocoder, 폴백 전용)
  geocoding: ^3.0.0

  # OpenStreetMap Nominatim 역지오코딩 HTTPS 호출 (한국 도로명주소 1순위, 키 불필요)
  http: ^1.2.2

  # 외부 URL/앱 실행 (네이버 지도 앱 또는 웹 버전 열기)
  url_launcher: ^6.3.1
  google_mobile_ads: ^8.0.0
  share_plus: ^13.1.0
  in_app_purchase: ^3.2.3

  # 사진 EXIF 메타데이터 제거 — 카카오톡 공유/외부 전송 시 촬영 위치(GPS) 노출 방지.
  # PIPA / 위치정보법 컴플라이언스: 사진에 박힌 GPS 좌표가 PII 로 분류됨.
  image: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code generation
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/legal/
